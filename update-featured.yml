name: Update Featured Projects

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-featured.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate Featured Projects block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          USER = "bazzazi"
          req = urllib.request.Request(
              f"https://api.github.com/users/{USER}/repos?per_page=100&sort=updated",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
          )
          repos = json.load(urllib.request.urlopen(req))
          repos = [r for r in repos if not r["fork"] and r["name"].lower() != USER.lower()]
          # sort: most stars first, then most recently updated
          repos.sort(key=lambda r: (-r["stargazers_count"], r["updated_at"]), reverse=False)
          repos.sort(key=lambda r: (-r["stargazers_count"],
                                    -int(r["updated_at"].translate(str.maketrans("", "", "-:TZ")))))
          top = repos[:4]

          def card(r):
              url = (f"https://github-readme-stats.vercel.app/api/pin/"
                     f"?username={USER}&repo={r['name']}&theme=tokyonight"
                     f"&hide_border=true&bg_color=0D1117"
                     f"&title_color=8B5CF6&icon_color=EC4899&text_color=C9D1D9")
              return (f'<td width="50%" valign="top">\n'
                      f'<a href="{r["html_url"]}">\n'
                      f'  <img src="{url}" width="100%"/>\n'
                      f'</a>\n</td>')

          rows = []
          for i in range(0, len(top), 2):
              rows.append("<tr>\n" + "\n".join(card(r) for r in top[i:i+2]) + "\n</tr>")

          block = "<!-- FEATURED:START -->\n<table>\n" + "\n".join(rows) + "\n</table>\n<!-- FEATURED:END -->"

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()
          new = re.sub(r"<!-- FEATURED:START -->.*?<!-- FEATURED:END -->",
                       block, readme, flags=re.S)
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new)
          PY

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git add README.md
            git commit -m "chore: refresh Featured Projects [skip ci]"
            git push
          else
            echo "No changes."
          fi
